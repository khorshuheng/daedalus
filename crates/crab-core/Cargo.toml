[package]
name = "crab-core"
description = "Crab core library: synchronous agent engine, tools, providers, persistence and memory (CRAB-117 workspace split)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "crab_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# CRAB-130: the provider layer moved to rig-core (async); the hand-written
# HTTP/SSE clients and their MSRV-era pins are gone.
rig-core = "=0.42.0"
# CRAB-130: crab-core is async — tokio drives the turn loop (current-thread
# runtime owned by the worker thread), tokio-util provides CancellationToken.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
futures = "0.3"
# Era pins from CRAB-119 are retired with the MSRV-1.85 floor (CRAB-130).
rusqlite = "0.37"
thiserror = "2"
directories = "6"
tempfile = "3"
similar = "2"
keyring = { version = "3", features = ["sync-secret-service"] }
# bash process-group kill (CRAB-107 #14) uses libc setsid/kill on Unix.
libc = "0.2"
# NFKC normalization for fuzzy edit matching (CRAB-107 #15).
unicode-normalization = "0.1"

# CRAB-130: the crate is async now (tokio). The runtime stays runtime-agnostic
# (no #[tokio::main]); the worker thread owns a current-thread runtime.
