[package]
name = "crab"
description = "Crab CLI: a minimal coding agent, modeled on the pi coding agent (CRAB-117 workspace split)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "crab"
path = "src/main.rs"

[dependencies]
crab-core = { path = "../crab-core" }
serde_json = "1"
# term.rs uses libc for raw terminal input mode.
libc = "0.2"
# Maintainability crates (CRAB-119), era-appropriate for the 1.85 MSRV floor.
clap = { version = "=4.5.23", features = ["derive"] }
anyhow = "=1.0.95"
# TUI (CRAB-121): ratatui 0.29 (MSRV 1.74) + crossterm 0.28 (MSRV 1.63).
ratatui = "=0.29.0"
crossterm = "=0.28.1"
directories = "=5.0.1"

# The crab binary owns its frontend dependencies (term, stdio modes). Async
# server deps (axum/tokio) arrive with crates/crab-server in CRAB-122, so this
# crate never compiles them.

[dev-dependencies]
tempfile = "=3.15.0"
