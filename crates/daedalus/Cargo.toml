[package]
name = "daedalus"
description = "Daedalus CLI: a minimal coding agent, modeled on the pi coding agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "dd"
path = "src/main.rs"

[dependencies]
daedalus-core = { path = "../daedalus-core" }
serde_json = "1"
# Blocking bridges over daedalus-core's async seams (session auto-save)
# and the async Provider trait used by the test fakes.
tokio = { version = "1", features = ["rt"] }
tokio-util = "0.7"
futures = "0.3"
# Libc dropped from this crate — it was only used by term.rs's
# REPL raw-mode line editor. crossterm owns the terminal for the TUI.
# The MSRV-era exact pins are retired (workspace rust-version is now
# 1.94); ranges are caret-compatible with the currently locked versions.
clap = { version = "4.5.23", features = ["derive"] }
anyhow = "1.0.95"
# TUI: ratatui 0.29 + crossterm 0.28.
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, used to keep
# the transcript pinned to the true bottom once lines wrap.
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = "0.28.1"
# Display-width of input text so the caret column is correct for
# wide (CJK) and zero-width chars. Already in the tree via ratatui 0.29.
unicode-width = "0.2.0"
# CommonMark parsing for the transcript's markdown renderer.
pulldown-cmark = { version = "0.13", default-features = false }

# The daedalus binary owns its frontend dependencies (term, stdio modes). Async
# server deps (axum/tokio) arrive with crates/daedalus-server, so this
# crate never compiles them.

[dev-dependencies]
tempfile = "3.15.0"
