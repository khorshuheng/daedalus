[package]
name = "crab"
version = "0.1.0"
edition = "2021"
description = "A minimal coding agent in Rust, modeled on the pi coding agent."

[[bin]]
name = "crab"
path = "src/main.rs"

[lib]
name = "crab"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Pin HTTP stack so transitive url/icu crates stay Rust-1.86 compatible.
ureq = { version = "=2.9.1", features = ["json"] }
url = "=2.4.1"
