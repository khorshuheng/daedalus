# Cargo workspace (CRAB-117).
#
# The split keeps the synchronous core (daedalus-core) free of any async or
# frontend dependency, and gives each frontend its own dependency tree.
# Members:
#   crates/daedalus-core — the async library (config, tools, provider, session,
#                      runtime, workspace).
#   crates/daedalus     — the CLI binary (main + stdio modes + TUI frontend; the
#                     interactive REPL was removed in CRAB-135).
#   crates/daedalus-server — the headless WebSocket server (CRAB-124), a frontend
#                     over the same AgentRuntime protocol.
#
# CRAB-122 adds crates/daedalus-server (axum/tokio/tungstenite) later.

[workspace]
resolver = "2"
members = ["crates/daedalus-core", "crates/daedalus", "crates/daedalus-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version (first 2025 release). Cargo's MSRV-aware
# resolver keeps dependencies compatible with this floor, so the project stays
# buildable on older rust even as Arch keeps updating the installed toolchain.
rust-version = "1.94"
