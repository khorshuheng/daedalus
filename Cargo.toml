# Cargo workspace (CRAB-117).
#
# The split keeps the synchronous core (crab-core) free of any async or
# frontend dependency, and gives each frontend its own dependency tree.
# Members:
#   crates/crab-core — the sync library (config, tools, provider, session,
#                      memory, reflect, index, runtime, workspace).
#   crates/crab     — the CLI binary (main + stdio modes + TUI frontend; the
#                     interactive REPL was removed in CRAB-135).
#
# CRAB-122 adds crates/crab-server (axum/tokio/tungstenite) later.

[workspace]
resolver = "2"
members = ["crates/crab-core", "crates/crab"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version (first 2025 release). Cargo's MSRV-aware
# resolver keeps dependencies compatible with this floor, so the project stays
# buildable on older rust even as Arch keeps updating the installed toolchain.
rust-version = "1.85"
